[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edmdc-tank-observables"
version = "1.0.0"
description = "Observable dictionaries for Koopman-EDMDc identification of a laboratory-scale tank level system"
authors = [{ name = "Amanda Martí-Coll" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4",
    "pandas>=3.0",
    "matplotlib>=3.11",
    "scipy>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
